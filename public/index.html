<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Versus</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <h1>Bingo 1v1</h1>
    <div id="scoreboard" class="scoreboard" style="display:none;"></div>
    <div id="status" class="alert">Memuat koneksi server...</div>

    <div id="login-section" class="section">
        <h2>Masukkan Username</h2>
        <input type="text" id="username-input" placeholder="Nama Anda" required>
        <button id="btn-join" onclick="joinGame()">Masuk Lobby</button>
    </div>

    <div id="lobby-section" class="section" style="display:none;">
        <h2>Ruang Tunggu (Lobby)</h2>
        <ul id="player-list"></ul>
        <button id="btn-lobby-ready" onclick="setLobbyReady()">Ready</button>
    </div>

    <div id="setup-section" class="section" style="display:none;">
        <h2 id="setup-round"></h2>
        <p id="setup-starter" class="starter-info"></p>
        <p>Isi 25 angka acak (1 - 25). <strong>Tidak boleh duplikat!</strong></p>
        <div id="setup-grid" class="grid"></div>
        <div class="btn-row">
            <button id="btn-generate" class="btn-secondary" onclick="generateBoard()">🎲 Acak Otomatis</button>
            <button id="btn-clear" class="btn-ghost" onclick="clearBoard()">Kosongkan</button>
            <button id="btn-board-ready" onclick="submitBoard()">Simpan &amp; Main</button>
        </div>
    </div>

    <div id="game-section" class="section" style="display:none;">
        <h2 id="turn-info"></h2>
        <p id="starter-info" class="starter-info"></p>
        <h3 id="lines-info" style="color:#d63031;">Baris Bingo: 0 / 5</h3>
        <div id="game-grid" class="grid"></div>
        <p id="click-hint" class="hint">Klik angka di papan untuk memanggilnya, atau ketik di kotak bawah.</p>
        <div id="controls">
            <input type="number" id="number-input" placeholder="Panggil angka (1-25)..." min="1" max="25">
            <button id="btn-call" onclick="callNumber()">Panggil Angka</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js?v=2"></script>
</body>
</html>
